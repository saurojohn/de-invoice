version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: de-invoice-postgres
    environment:
      POSTGRES_USER: de_invoice
      POSTGRES_PASSWORD: de_invoice_pass
      POSTGRES_DB: de_invoice
    # Tier 297: bump max_connections from the Postgres
    # default of 100 to 300. The backend e2e suite
    # (99 scripts) opens many simultaneous connections
    # during the full run-all.sh, and 100 is too tight
    # — the suite hits "FATAL: sorry, too many clients
    # already" around spec 20 and cascades 10+ transient
    # failures downstream. 300 leaves headroom for the
    # NestJS backend (Prisma connection pool, default
    # 10 per process) plus the test runners.
    command: postgres -c max_connections=300 -c shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_invoice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
