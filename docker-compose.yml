version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: de-invoice-postgres
    environment:
      POSTGRES_USER: de_invoice
      POSTGRES_PASSWORD: de_invoice_pass
      POSTGRES_DB: de_invoice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_invoice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
