# ─────────────────────────────────────────────────────────────────
# de-invoice production nginx config
#
# Architecture: nginx terminates TLS, rate-limits /api/v1/auth/login,
# proxies /api/* to backend:3001 and everything else to frontend:3000.
#
# This file is read by the host-installed nginx (NOT a container),
# so the upstream hostnames must match the Docker Compose service
# names. On the host, those resolve via the default `deinvoicenet`
# bridge network IF you run `docker network create deinvoicenet`
# with the `--attachable` flag and add the host to it via
# `docker network connect deinvoicenet <host-iface>`. The simpler
# alternative is to put nginx inside the docker-compose stack as a
# service too (see docker-compose.yml alternative section).
#
# For now we recommend the host-nginx setup because certbot is
# simpler on the host. The cert path /etc/letsencrypt is the default
# for certbot.
# ─────────────────────────────────────────────────────────────────

# Rate limit zone for the auth endpoint.
# 5 req/min per IP is the backend's own @Throttle limit;
# we add a HARDER limit here so a single attacker
# can't even reach the backend's login rate limit.
# 10 req/min allows for retry, password manager auto-fill,
# or two users on the same NAT. Anything more than that
# is suspicious.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# Upstream — Docker Compose service names resolve via
# the default bridge network IF nginx is also on the
# bridge (e.g. via `--network host` or the `nginx-on-host`
# pattern below).
upstream de_invoice_backend {
    server backend:3001;
    keepalive 32;
}

upstream de_invoice_frontend {
    server frontend:3000;
    keepalive 32;
}

# HTTP → HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name rechnung.shleder.de;

    # ACME http-01 challenge (certbot renews via this).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rechnung.shleder.de;

    # TLS certs — managed by certbot.
    ssl_certificate /etc/letsencrypt/live/rechnung.shleder.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rechnung.shleder.de/privkey.pem;

    # Modern TLS config — TLS 1.2+ only, no RC4/3DES.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off; # let client pick; modern clients know better

    # HSTS — force HTTPS for 6 months on this domain.
    # Once you've confirmed HTTPS works, raise this to
    # 31536000 (1 year) and add `preload` to submit to
    # the browser preload list.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # Security headers — see https://owasp.org/www-project-secure-headers/
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Upload size for PDF attachments.
    # 50 MB is the sweet spot: a multi-page
    # scanned receipt is ~5MB, and 10 receipts
    # in a single upload is ~50MB.
    client_max_body_size 50M;

    # Logging — JSON-ish format suitable for
    # downstream parsers. timestamp + request
    # line + status + size + duration + IP.
    log_format deinvoicenet '$remote_addr - $remote_user [$time_iso8601] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time';
    access_log /var/log/nginx/de-invoice.access.log deinvoicenet;
    error_log /var/log/nginx/de-invoice.error.log warn;

    # ── /api/* → backend ──────────────────────────────────
    location /api/ {
        # Strip the /api prefix? No — the backend
        # mounts routes at /api/v1/*. The frontend
        # calls e.g. POST /api/v1/invoices. We pass
        # through unchanged.
        proxy_pass http://de_invoice_backend;

        # Pass-through headers that the backend needs.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout for /api/v1/accounting/journal/pdf
        # which can take 5-10s for a full year of vouchers.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # No buffering for streaming responses (PDFs).
        proxy_buffering off;

        # Keep alive.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Rate limit the auth endpoint specifically.
        # 5 req/min per IP, with a burst of 10 (so the
        # first 10 requests in a minute pass, the rest
        # get 429). The backend has its own @Throttle
        # at 5/min but this gives us a defense in depth.
        location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
            limit_req zone=login burst=10 nodelay;
            proxy_pass http://de_invoice_backend;
            # (duplicate proxy_set_headers — they're
            # scoped to this location only.)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # ── /storage/* → backend (PDFs, attachments) ─────────
    # The backend serves these from /api/v1/storage/files/*
    # but we expose them under /storage/* for cleaner URLs.
    # The frontend uses /api/v1/storage/files/<path> directly,
    # but a user might bookmark a /storage URL.
    location /storage/ {
        proxy_pass http://de_invoice_backend/api/v1/storage/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache for 1 hour — invoice PDFs are immutable
        # once created, so aggressive caching is safe.
        proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── /uploads/* → backend (uploaded PDFs) ───────────
    # Same pattern as /storage/.
    location /uploads/ {
        proxy_pass http://de_invoice_backend/api/v1/storage/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── everything else → frontend ─────────────────────
    location / {
        proxy_pass http://de_invoice_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long polling for Next.js dev mode HMR (not used
        # in prod, but cheap to keep).
        proxy_read_timeout 60s;

        # Cache static assets aggressively.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://de_invoice_frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}