# syntax=yaml/docker-compose-spec
# ─────────────────────────────────────────────────────────────────
# de-invoice production stack — single-host Docker Compose
#
# Architecture (Tier 114 — Caddy replaces nginx):
#
#   Internet ──► caddy (80/443, auto-TLS via Let's Encrypt)
#                    │
#                    ├─► frontend:3000 (Next.js standalone)
#                    └─► backend:3001  (NestJS, compiled)   
#                              │
#                              └─► postgres:5432
#
# + backup container (cron-style) that runs pg_dump to /backups
#
# All services run on the default `deinvoicenet` network so
# the backend can reach postgres by hostname (not localhost)
# and the frontend can reach the backend by hostname.
#
# Volumes:
#   - pgdata        Postgres data (persistent across restarts)
#   - storage       /data/invoice-system (PDFs, attachments)
#   - backups       pg_dump output + retention
#   - caddy_data    Caddy's cert + ACME account state
#   - caddy_config  Caddy's runtime config (snippets, on-demand)
#
# Usage:
#   cp .env.example .env  # then edit secrets
#   docker compose -f infra/prod/docker-compose.yml pull
#   docker compose -f infra/prod/docker-compose.yml up -d
#   docker compose -f infra/prod/docker-compose.yml logs -f
#
# Why single-host instead of k8s/cluster:
#   - SH Leder is one customer with
#     ~5 users, not 500. Single
#     4GB VPS handles it fine.
#   - k8s adds operational overhead
#     (cluster upgrades, RBAC, ingress
#     controllers, secrets management)
#     that doesn't pay back at this
#     scale.
#   - Single-host + daily pg_dump
#     backups + healthcheck ping is
#     the simplest deploy that meets
#     GoBD §146 AO retention + RPO <24h.
#
# Why Caddy in front instead of exposing
# frontend/backend directly:
#   - Auto-TLS: Caddy does ACME + renewal
#     itself. No certbot, no cron, no
#     manual rotation.
#   - Rate limiting per IP (defense
#     against credential stuffing on
#     /api/v1/auth/login)
#   - Static asset caching for /public
#     and .next/static
#   - HSTS + secure cookie flags
#
# Why Caddy IS in docker (Tier 114, vs Tier 17's host-nginx):
#   - Caddy stores certs + the ACME
#     account in a data dir that maps
#     cleanly to a named volume. No
#     host /etc/letsencrypt to wrangle.
#   - Caddy reads its config from a
#     file; mounting the Caddyfile as
#     a bind-mount makes it part of
#     the deployable artifact (no
#     drift between repo and what's
#     running).
#   - One `docker compose up -d` brings
#     up the entire stack — proxy
#     included. No host-side nginx
#     install step.
# ─────────────────────────────────────────────────────────────────

# Tier 563: a fixed project name, so the volumes are always called
# de-invoice-prod_pgdata / _storage / _backups / _caddy_data / _caddy_config.
# Without it the name came from the directory ("prod_…"), and the docs used
# two other spellings.
name: de-invoice-prod

networks:
  deinvoicenet:
    driver: bridge

volumes:
  pgdata:
    # Postgres data — survives `docker compose down` (without -v).
    # Use `docker volume rm deinvoicenet_pgdata` to wipe.
  storage:
    # PDFs + invoice attachments.
    # Bound to /data/invoice-system in the backend container.
  backups:
    # pg_dump output. The backup container writes here.
    # The host can also mount this volume to copy backups offsite.
  caddy_data:
    # Caddy's data dir — stores issued certs, ACME account
    # state, and on-demand TLS state. Without this volume
    # the certs would be lost on every `docker compose up`
    # and Let's Encrypt would hit its rate limit fast.
  caddy_config:
    # Caddy's config dir — stores the active config.json
    # (rewritten on every reload) and any admin-API snippets.
    # Kept separate from caddy_data so you can wipe one
    # without losing the other.

services:
  # ─── Postgres ───────────────────────────────────────────────
  # We use the official postgres:16 image.
  # 16 is the LTS line as of 2026-11 and
  # has all the features our app needs
  # (jsonb, generated columns, partial
  # indexes). 14/15 are also fine but
  # have shorter support windows.
  postgres:
    image: postgres:16-alpine
    container_name: de-invoice-postgres
    restart: unless-stopped
    networks: [deinvoicenet]
    # Tier 18: promtail uses these labels to filter
    # which containers to ship logs for. We tag every
    # de-invoice container so docker-compose users who
    # run unrelated services don't get their logs mixed
    # into our Loki namespace.
    labels:
      de-invoice.observability: "true"
      de-invoice.service: "postgres"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-de_invoice}
      POSTGRES_USER: ${POSTGRES_USER:-de_invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # PG tuning for a 4GB VPS
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      # Aliyun-style locale for date formatting
      LANG: en_US.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init script: enables citext, uuid-ossp extensions if
      # the app needs them later. Idempotent.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # pg_isready exits 0 when postgres is ready to
      # accept connections. We use the dedicated
      # /health endpoint in our own backend for the
      # app-level healthcheck; this is for docker's
      # container-level restart policy.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-de_invoice} -d ${POSTGRES_DB:-de_invoice}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    # Resource limits (optional but recommended
    # for noisy-neighbor protection on a shared VPS).
    deploy:
      resources:
        limits:
          memory: 1G
    # Don't expose postgres port to the host —
    # nginx + backend connect via the
    # deinvoicenet network. If you need to
    # debug, `docker exec -it de-invoice-postgres psql ...`.

  # ─── Backend (NestJS + Prisma) ──────────────────────────────
  # We build from the local Dockerfile. Build
  # context is the repo root so we can COPY
  # both backend/ and prisma/. The Dockerfile
  # itself is in backend/.
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      # Tier 569: the official XRechnung validator's files, for the image.
      additional_contexts:
        kosit: ../kosit
    image: de-invoice-backend:latest
    container_name: de-invoice-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deinvoicenet]
    labels:
      de-invoice.observability: "true"
      de-invoice.service: "backend"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Tier 478: German business days (issue dates, "today", overdue) —
      # the code pins Europe/Berlin where it matters; this keeps the rest
      # (logs, schedulers' local time) on the same clock.
      TZ: Europe/Berlin
      DATABASE_URL: postgresql://${POSTGRES_USER:-de_invoice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-de_invoice}?schema=public&connection_limit=8
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required, e.g. https://rechnung.shleder.de}
      # Production secrets — see README for rotation
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # Optional — used by ECB rate fetcher
      # (no-op if unset)
      ECB_API_URL: ${ECB_API_URL:-}
      # Tier 555: this list is all the backend sees — a variable that is only
      # in .env does not reach it. The x-user-id header authenticates nobody
      # in production (session cookie / Bearer only).
      ALLOW_HEADER_AUTH: "0"
      # Tier 555: the proxy is another container — without this every visitor
      # has the proxy's address and shares one rate limit.
      TRUST_PROXY: "true"
      # Tier 557: the receipt scanner's engine. "mock" answers every scan with
      # one invented receipt — for development only.
      OCR_ENGINE: ${OCR_ENGINE:-tesseract}
      # Read by the backend, and without effect unless listed here:
      APP_ORIGIN: ${APP_ORIGIN:-}
      FINTS_PIN_ENC_KEY: ${FINTS_PIN_ENC_KEY:-}
      # Tier 568: the demo bank (invented transactions) stays off in
      # production. 1 turns it on — for a demo installation only.
      FINTS_ALLOW_MOCK: ${FINTS_ALLOW_MOCK:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      # Tier 548 / 565: who may use the installation-wide routes (backups,
      # schedulers, storage): the admins of the oldest company. With addresses
      # here, only those of them — the list narrows that circle, it cannot
      # name someone outside it (registration does not verify addresses).
      SYSTEM_ADMIN_EMAILS: ${SYSTEM_ADMIN_EMAILS:-}
      # Tier 549: when set, GET /metrics needs `Authorization: Bearer <token>`.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Optional — VIES mock mode for offline tests.
      # MUST be empty/unset in prod. We don't
      # expose this as a "real" env var — the
      # code reads `process.env.VIES_MOCK` and the
      # compose file just doesn't set it.
    volumes:
      - storage:/data/invoice-system
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  # ─── Frontend (Next.js standalone) ──────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      # Tier 363: NEXT_PUBLIC_* values are inlined by `next build`, so the
      # browser-side API base has to be a BUILD arg. It used to be passed only
      # as runtime `environment:`, which never reached the bundle — the image
      # fell back to http://localhost:3001. Caddy serves /api/* on the same
      # origin, so the public FRONTEND_URL is the right value. Rebuild after
      # changing it.
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_URL:?FRONTEND_URL is required (public URL, e.g. https://rechnung.example.de)}
    image: de-invoice-frontend:latest
    container_name: de-invoice-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks: [deinvoicenet]
    labels:
      de-invoice.observability: "true"
      de-invoice.service: "frontend"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # NEXT_PUBLIC_API_URL is a build arg (see build.args
      # above); setting it here at runtime has no effect.
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Backup (cron-style) ───────────────────────────────────
  # Runs pg_dump once per day, gzip, write
  # to /backups, retain 30 days. Uses
  # a `oneshot` style service that runs
  # `cron` in the foreground — not a
  # long-running daemon. Restart policy
  # `on-failure` keeps it idempotent.
  #
  # Why a separate container instead of
  # a host cron job?
  #   - The backup needs access to the
  #     postgres container's network +
  #     credentials. Sharing them with
  #     the host requires duplicating
  #     them in /etc/. Putting the cron
  #     in a container means it inherits
  #     the same env vars + network as
  #     the rest of the stack.
  #   - It's portable — anyone with the
  #     compose file can reproduce the
  #     backup behavior without setting
  #     up host cron.
  backup:
    # Tier 563: the tag is the PostgreSQL version and must match the server
    # (postgres:16 above). Untagged, the image brought pg_dump 18: its dumps
    # start with `SET transaction_timeout`, which a 16 server rejects — a
    # restore that stops at the first error stopped right there.
    image: prodrigestivill/postgres-backup-local:16
    # Why this image: it implements the
    # standard pg_dump + retention loop
    # (~600 lines of bash, well-tested
    # by the community). Reimplementing
    # it in our repo would mean
    # maintaining another file that
    # doesn't add value.
    container_name: de-invoice-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [deinvoicenet]
    labels:
      de-invoice.observability: "true"
      de-invoice.service: "backup"
    environment:
      # Tier 562: the names this image reads. It was given PGHOST / PGUSER /
      # PGPASSWORD / PGDATABASE, which it ignores: the container stopped at
      # start with "You need to set the POSTGRES_DB … environment variable"
      # and no backup was ever written.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-de_invoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-de_invoice}
      # Run at 03:00 Europe/Berlin every day
      # (off-peak — server is idle at night
      # for SH Leder's 8-18 CET business hours).
      SCHEDULE: "0 3 * * *"
      # Europe/Berlin so the schedule matches
      # the customer's timezone, not UTC.
      TZ: Europe/Berlin
      # Keep 30 daily dumps (plus the image's defaults: 4 weekly, 6 monthly).
      # This is how far back a restore can reach — it is NOT the statutory
      # retention of the records themselves (§ 147 AO: 8 / 10 years), which
      # is about the data in the database and the files in `storage`.
      BACKUP_KEEP_DAYS: "30"
      # Tier 562: BACKUP_COMPRESS, BACKUP_FILE_PREFIX, HEALTHCHECK_URL and
      # HEALTHCHECK_PING_URL stood here; this image reads none of them. Dumps
      # are gzip'd and named <database>-<timestamp>.sql.gz by default, under
      # /backups/{last,daily,weekly,monthly}. For a ping after each run use
      # the image's hooks (/hooks) — see its README.
    volumes:
      - backups:/backups

  # ─── Caddy (reverse proxy + auto-TLS) ──────────────────
  # Tier 114: replaces the host-nginx pattern from
  # Tier 17. Caddy auto-issues + auto-renews Let's
  # Encrypt certs via the ACME HTTP-01 challenge.
  #
  # Why ports 80 + 443 on the host:
  #   - 80 is needed for the HTTP-01 challenge. Caddy
  #     binds a tiny listener that serves /.well-known/
  #     acme-challenge/<token> for the LE validator.
  #   - 443 is the production HTTPS port. Caddy serves
  #     the app and redirects 80 → 443 by default.
  #   - The Caddyfile (bind-mounted) defines the site
  #     block + reverse-proxy rules.
  #
  # Volume plan:
  #   - /data is the Caddy data dir (certs + ACME
  #     account). Persisting this is critical — without
  #     it every container restart re-issues a cert and
  #     hits the LE rate limit within a day.
  #   - /config is where Caddy writes its active
  #     config.json. Useful for inspecting what Caddy
  #     thinks the config is (after macro expansion).
  caddy:
    image: caddy:2-alpine
    container_name: de-invoice-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [deinvoicenet]
    labels:
      de-invoice.observability: "true"
      de-invoice.service: "caddy"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Caddy reads the Caddyfile from the bind-mount
      # above. No env vars needed for the basic config;
      # the Caddyfile's `email` directive is where the
      # LE-registration email lives.
      CADDY_ADMIN: "0.0.0.0:2019"
    # No healthcheck on the caddy container itself.
    # Caddy's admin API at :2019 is for runtime config
    # (reload, on-demand TLS); checking it from the
    # compose level adds noise without value. The
    # backend /api/v1/health behind Caddy is the
    # real readiness signal.
    deploy:
      resources:
        limits:
          memory: 128M
    # Run the caddy process in the foreground. The
    # caddy:2-alpine image's default CMD already does
    # this; left explicit for clarity.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", ""]