# syntax=yaml/docker-compose-spec
# ─────────────────────────────────────────────────────────────────
# de-invoice observability stack (Tier 18, OPT-IN)
#
# Overlay compose file that adds Prometheus + Grafana + Loki +
# Promtail + cAdvisor to the main prod stack. Use:
#
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.observability.yml \
#                  up -d
#
# Why an overlay instead of baked into the main compose:
#   - Observability has non-trivial RAM cost
#     (~250MB for Prometheus + 200MB for Grafana +
#     100MB for Loki). On a 4GB VPS that's a 14%
#     tax; some VPS plans can't afford it.
#   - Users who already have their own observability
#     stack (Datadog, New Relic, etc.) don't need
#     this overlay at all.
#
# What this adds:
#   - prometheus:9090   metrics scraper (15s interval)
#   - grafana:3001      dashboards (admin/admin on first login)
#   - loki:3100         log aggregation (single-instance mode)
#   - promtail:9080     log shipper (tailed from /var/lib/docker)
#   - cadvisor:8080     container-level CPU/RAM metrics
#
# Grafana is the only one exposed to the host (port 3001 —
# free port since the backend's also on 3001 INSIDE the
# deinvoicenet, but on the host it's the frontend's 3000).
# To reach Grafana: ssh -L 3001:localhost:3001 <vps>, then
# http://localhost:3001.
#
# SECURITY (Tier 576): Grafana and Prometheus are published on
# 127.0.0.1 only, and GRAFANA_ADMIN_PASSWORD must be set — the
# overlay refuses to start without it. To reach Grafana from
# outside, put it behind the Caddy proxy with its own login;
# do not publish the port.
# ─────────────────────────────────────────────────────────────────

networks:
  # Tier 576: the same network the main compose file defines — nothing more.
  # This said `name: deinvoicenet` + `external: true`; merged with the main
  # file that turned the app's own network into an external one that nothing
  # creates ("network deinvoicenet declared as external, but could not be
  # found") — adding the overlay stopped the whole stack from starting.
  deinvoicenet: {}

volumes:
  prometheusdata:
  grafanadata:
  lokidata:
  promtail_positions:
  alertmanagerdata:

services:
  # ─── Prometheus ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: de-invoice-prometheus
    restart: unless-stopped
    networks: [deinvoicenet]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ../../infra/observability/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    # Tier 576: localhost only — SSH-tunnel to use it. Published on every
    # interface, Prometheus (no login) was open to the internet: a port
    # published by Docker is not held back by ufw.
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      # Prometheus /-/ready returns 200 when ready.
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ─── Grafana ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: de-invoice-grafana
    restart: unless-stopped
    networks: [deinvoicenet]
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Tier 576: no default — this was admin / admin unless someone changed it.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required for the monitoring overlay (set it in the env file)}
      # Anonymous access disabled (require login).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Telemetry off (don't phone Grafana Labs).
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USAGE_STATS_ENABLED: "false"
      # Default dashboard home — show the de-invoice
      # dashboard we provisioned.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/de-invoice.json
    volumes:
      - ../../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/observability/grafana/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"   # Tier 576: localhost only (was every interface) → container:3000
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Loki ────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.2.1
    container_name: de-invoice-loki
    restart: unless-stopped
    networks: [deinvoicenet]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../../infra/observability/loki:/etc/loki:ro
      - lokidata:/loki
    # Loki listens on 3100 inside the container. We don't
    # expose it to the host — only Grafana (and Promtail
    # on the deinvoicenet) need to reach it.
    ports:
      - "127.0.0.1:3100:3100"   # localhost only
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Promtail ────────────────────────────────────────────
  # Reads /var/lib/docker/containers from the HOST — that's
  # why we bind-mount /var/lib/docker and /var/run/docker.sock.
  # Filter by label `de-invoice.observability=true` so we
  # don't try to scrape unrelated containers.
  promtail:
    image: grafana/promtail:3.2.1
    container_name: de-invoice-promtail
    restart: unless-stopped
    networks: [deinvoicenet]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ../../infra/observability/promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M

  # ─── cAdvisor ────────────────────────────────────────────
  # Container-level CPU / RAM / network metrics.
  # The backend's own /metrics gives us app-level data;
  # cAdvisor gives us the OS-level breakdown of each
  # container (postgres, backend, frontend, backup).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: de-invoice-cadvisor
    restart: unless-stopped
    networks: [deinvoicenet]
    # cAdvisor needs rw access to cgroup + docker state.
    # In rootless Docker these may not be readable.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8080:8080"   # localhost only
    privileged: true
    devices:
      - /dev/kmsg
    deploy:
      resources:
        limits:
          memory: 256M

  # ─── Alertmanager (Tier 23) ────────────────────────────
  # Receives fired alerts from Prometheus and dispatches
  # to Slack + email per the routing tree in
  # infra/observability/alertmanager/alertmanager.yml.
  # Exposed to localhost on 9093 for ad-hoc debugging
  # (the /-/ready health endpoint is the self-monitor
  # target — wire it into Healthchecks.io or similar).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: de-invoice-alertmanager
    restart: unless-stopped
    networks: [deinvoicenet]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    volumes:
      - ../../infra/observability/alertmanager:/etc/alertmanager:ro
      - alertmanagerdata:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M