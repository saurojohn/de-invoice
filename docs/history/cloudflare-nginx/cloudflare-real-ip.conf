# ─────────────────────────────────────────────────────────────────
# de-invoice — Cloudflare real-IP restore (Tier 19)
#
# Include this file from your nginx http {} block:
#
#   http {
#     include /etc/nginx/cloudflare/cloudflare-real-ip.conf;
#     ...other nginx config...
#   }
#
# Why this file exists:
#   When Cloudflare is in front of nginx (orange-cloud DNS), every
#   incoming TCP connection comes from a Cloudflare edge IP, NOT
#   the real visitor. nginx's $remote_addr therefore shows CF IPs
#   in access logs and rate-limit zones — which:
#     - Makes the auth rate limit useless (one CF IP for everyone)
#     - Pollutes audit logs (records CF IPs, not visitor IPs)
#     - Breaks any per-IP allowlist (e.g. GeoIP blocks)
#
# What this file does:
#   - Tells nginx to TRUST the CF-Connecting-IP header for
#     connections coming FROM Cloudflare's edge network.
#   - real_ip_header CF-Connecting-IP uses CF's authenticated
#     header (set by CF edge servers, not spoofable by clients
#     because CF strips any client-supplied CF-Connecting-IP).
#   - real_ip_recursive on means: if X-Forwarded-For is also set,
#     take the LAST (rightmost) trusted hop, not the first. This
#     prevents chain pollution when there are multiple proxies.
#
# IMPORTANT — IP ranges must be kept current:
#   CF occasionally adds new edge IP ranges (last time 2024-04).
#   Use refresh-cloudflare-ips.sh (sibling file) to update this
#   file automatically on a weekly systemd timer.
#
# Sources:
#   IPv4: https://www.cloudflare.com/ips-v4/
#   IPv6: https://www.cloudflare.com/ips-v6/
#   (Last updated: 2026-06-28)
# ─────────────────────────────────────────────────────────────────

# Cloudflare IPv4 edge network
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 edge network
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Use CF-Connecting-IP as the source of truth for the real
# visitor IP. CF-Connecting-IP is set by CF edge servers only
# (clients cannot inject it — CF overwrites any client value).
real_ip_header CF-Connecting-IP;

# Walk the X-Forwarded-For chain from the RIGHT (closest to us)
# instead of the LEFT (closest to client). This prevents an
# attacker from poisoning the chain by injecting a fake
# X-Forwarded-For at the edge.
real_ip_recursive on;