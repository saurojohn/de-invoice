worker_processes 1;
events { worker_connections 1024; }

http {
  access_log off;

  # Load the CF real-IP config we're testing.
  # In a real deployment this is at /etc/nginx/cloudflare/
  include /etc/nginx/test/cloudflare-real-ip.conf;

  server {
    listen 80;
    server_name localhost;

    # /whoami echoes the perceived client IP + the
    # original request headers. Used to verify that
    # CF-Connecting-IP restoration works.
    location = /whoami {
      default_type text/plain;
      return 200 "remote_addr=$remote_addr\ncf_connecting_ip=$http_cf_connecting_ip\nx_forwarded_for=$http_x_forwarded_for\nx_real_ip=$http_x_real_ip\n";
    }
  }
}
