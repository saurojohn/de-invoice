name: Docker images

# Tier 580 — the production images are built when what they are made of changes.
#
# Nothing built them: ci.yml runs the code from the checkout, and release.yml
# only runs on a `v*` tag (none was ever pushed). A Dockerfile that no longer
# builds — a renamed stage, a dependency that needs a system package, a type
# error now that the image compiles the backend — would have shown itself on
# the day of the first deployment.
#
# Only on changes to the files an image is built from (and by hand): the two
# builds take minutes of runner time, and most pushes touch none of them.
# Nothing is pushed to a registry.

on:
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'backend/docker-entrypoint.sh'
      - 'infra/prod/docker-compose.yml'
      - 'backend/.dockerignore'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/tsconfig.json'
      - 'backend/prisma/schema.prisma'
      - 'frontend/Dockerfile'
      - 'frontend/.dockerignore'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/next.config.*'
      - 'infra/kosit/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # the frontend refuses to build without its public URL (Tier 363);
          # any value will do for a build that is thrown away
          build-args: ${{ matrix.name == 'frontend' && 'NEXT_PUBLIC_API_URL=https://ci.example.invalid' || '' }}
          # the validator's files live outside ./backend (Tier 569)
          build-contexts: ${{ matrix.name == 'backend' && 'kosit=./infra/kosit' || '' }}
          push: false
          load: true
          tags: de-invoice-${{ matrix.name }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

      # The backend image is what it claims: the compiled program, without the
      # compiler, with the validator and a Java runtime for it.
      - name: Look inside the backend image
        if: matrix.name == 'backend'
        run: |
          docker run --rm --entrypoint sh de-invoice-backend:ci -ec '
            test -f dist/main.js
            node --check dist/main.js
            test ! -e node_modules/.bin/ts-node
            test ! -e node_modules/.bin/tsc
            test -d node_modules/.prisma/client
            test -f /infra/kosit/validator.jar
            java -version
          '
          test "$(docker inspect -f '{{json .Config.Cmd}}' de-invoice-backend:ci)" = '["node","--enable-source-maps","dist/main.js"]'
          # Tier 654: not root
          test "$(docker inspect -f '{{.Config.User}}' de-invoice-backend:ci)" = 'app'

      # Tier 654: the image started the way infra/prod/docker-compose.yml
      # starts it — read-only root filesystem, no capability, no new
      # privileges — against a PostgreSQL started the same way: the
      # migrations run, the program answers, it is `app`, and it can write
      # its storage and nothing else.
      - name: Run the backend image hardened
        if: matrix.name == 'backend'
        run: |
          set -euo pipefail
          bash backend/scripts/ci-pull-image.sh postgres:16-alpine
          docker network create harden
          docker run -d --name harden-pg --network harden --network-alias postgres \
            -e POSTGRES_DB=de_invoice -e POSTGRES_USER=de_invoice -e POSTGRES_PASSWORD=ci-only \
            -v "$PWD/infra/prod/init.sql:/docker-entrypoint-initdb.d/init.sql:ro" \
            --read-only --tmpfs /tmp --tmpfs /var/run/postgresql \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETGID --cap-add SETUID \
            --security-opt no-new-privileges:true postgres:16-alpine
          # Over TCP: while the image initialises a new data directory its
          # temporary server answers on the socket only — pg_isready said
          # "ready" there and the database did not exist yet.
          for i in $(seq 1 90); do docker exec harden-pg psql -h 127.0.0.1 -U de_invoice -d de_invoice -Atc 'select 1' >/dev/null 2>&1 && break; sleep 1; done
          docker exec harden-pg psql -h 127.0.0.1 -U de_invoice -d de_invoice -Atc 'select 1'
          HARD=(--read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true)
          ENVS=(--network harden -e NODE_ENV=production -e DISABLE_CRON=1
                -e "DATABASE_URL=postgresql://de_invoice:ci-only@postgres:5432/de_invoice?schema=public"
                -e JWT_SECRET=ci-only-0123456789abcdef0123456789abcdef -e FRONTEND_URL=http://localhost:3000)
          docker run --rm "${ENVS[@]}" -v harden-storage:/data/invoice-system "${HARD[@]}" de-invoice-backend:ci npx prisma migrate deploy | tail -2
          docker run -d --name harden-be "${ENVS[@]}" -v harden-storage:/data/invoice-system "${HARD[@]}" de-invoice-backend:ci
          for i in $(seq 1 60); do docker exec harden-be wget -qO- http://localhost:3001/api/v1/health/deep >/dev/null 2>&1 && break; sleep 2; done
          docker exec harden-be sh -ec '
            test "$(id -un)" = app
            wget -qO- http://localhost:3001/api/v1/health/deep | grep -q "\"storage\":{\"status\":\"ok\""
            grep -q "^CapEff:.0000000000000000" /proc/1/status
            grep -q "^NoNewPrivs:.1" /proc/1/status
            ! touch /app/written 2>/dev/null
            touch /data/invoice-system/written
          ' || { docker logs harden-be | tail -40; exit 1; }
          # a volume that belongs to root, with a file in it (an image from before
          # Tier 654; Docker gives an EMPTY volume the image's owner again by
          # itself): refused in words
          docker run --rm --user root --entrypoint sh -v harden-legacy:/data/invoice-system de-invoice-backend:ci \
            -c 'echo old > /data/invoice-system/old.pdf; chown -R root:root /data/invoice-system'
          if docker run --rm -v harden-legacy:/data/invoice-system "${HARD[@]}" de-invoice-backend:ci true 2> refusal.txt; then echo "started on a volume it cannot write"; exit 1; fi
          grep -q "is not writable by app" refusal.txt
          # … and handed over by the one run the message names
          docker run --rm -v harden-legacy:/data/invoice-system "${HARD[@]}" --user root \
            --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID de-invoice-backend:ci true
          docker run --rm -v harden-legacy:/data/invoice-system "${HARD[@]}" de-invoice-backend:ci \
            sh -ec 'test "$(id -un)" = app; test "$(stat -c %U /data/invoice-system/old.pdf)" = app; touch /data/invoice-system/written'

      - name: Run the frontend image hardened
        if: matrix.name == 'frontend'
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{.Config.User}}' de-invoice-frontend:ci)" = 'app'
          docker run -d --name harden-fe -e NODE_ENV=production -e PORT=3000 -e HOSTNAME=0.0.0.0 \
            --read-only --tmpfs /tmp --tmpfs /app/.next/cache --cap-drop ALL --security-opt no-new-privileges:true de-invoice-frontend:ci
          for i in $(seq 1 30); do docker exec harden-fe wget -q --spider http://localhost:3000/login 2>/dev/null && break; sleep 2; done
          docker exec harden-fe wget -q --spider http://localhost:3000/login || { docker logs harden-fe | tail -40; exit 1; }
