name: CI

# Tier 248 (2026-08-22) — CI redesigned for the 169-test
# backend e2e suite + 34 Playwright specs. Previous
# version (Tier 14 + 13) worked for the 43-test suite
# but had two gaps that surfaced when the suite grew:
#
#   1. No test-user seed. The e2e tests assume
#      `info@shleder.de / Test1234!` already exists.
#      The /auth/login step at the start of each test
#      would silently 401 and most tests would fail
#      with cryptic "expected 200, got 401" errors.
#
#   2. Wrong postgres topology. GitHub Actions
#      `services:` containers are isolated from the
#      runner's docker host — `docker exec` from
#      test scripts can't reach them. 127 of 169
#      backend tests do `docker exec de-invoice-postgres
#      psql ...` to verify DB state, so the e2e job
#      launches a sidecar postgres container in a
#      step (named `de-invoice-postgres` to match
#      local dev), not as a `services:` block.
#
# Jobs:
#   1. backend-typecheck — `tsc --noEmit` on the NestJS
#      server. Catches the same kind of errors that
#      ts-node crashes on at startup.
#   2. frontend-typecheck — `tsc --noEmit` on the
#      Next.js client. Same lesson as backend.
#   3. e2e — the full backend e2e suite (169 tests).
#      Spins up a sidecar postgres, runs prisma db
#      push, starts the backend, runs ci-seed.sh to
#      create the admin user, then runs run-all.sh.
#   4. playwright — the 34 UI tests against a real
#      headless Chromium. Same sidecar postgres,
#      reuses the seed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-flight CI run for the same ref
# when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://de_invoice:de_invoice_pass@localhost:5432/de_invoice?schema=public
      - run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://de_invoice:de_invoice_pass@localhost:5432/de_invoice?schema=public

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  e2e:
    name: End-to-end tests (backend)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://de_invoice:de_invoice_pass@localhost:5432/de_invoice?schema=public
      NODE_ENV: test
      # SMTP not configured in CI — the mail
      # service logs NO-SMTP warnings instead of
      # failing. The e2e suite asserts on the
      # response shape, not on real delivery.
      SMTP_HOST: ""
      # Storage base path for the Attachment
      # module. CI has no persistent disk, but
      # the e2e tests don't upload large files
      # — the temp dir is fine.
      STORAGE_PATH: /tmp/de-invoice-storage
      # VIES mock — VIES is the EU's VAT validation
      # SOAP service. It's frequently offline and
      # has rate limits; the e2e suite uses the
      # mock (deterministic answers based on the
      # VAT ID prefix) so the tests are
      # independent of the EU's uptime.
      VIES_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Tier 326: cache both backend and frontend
          # so the typecheck step below doesn't pay
          # the cold-install tax on every run.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Tier 326: the 'Build frontend (typecheck)' step
      # below runs `npx tsc --noEmit` in working-directory
      # frontend. Without an explicit `npm ci` for the
      # frontend first, npx tsc can't find the tsc binary
      # and the e2e job fails at the typecheck step
      # (observed: 58-second failure with no real e2e
      # issue). The Playwright job already does this
      # (line 245-248 below). Mirrored here.
      - run: npm ci
        working-directory: frontend
      - run: npx prisma generate
        working-directory: backend
      # Tier 248: launch a sidecar postgres
      # container, NOT a `services:` block. The
      # 127 e2e tests that use `docker exec
      # de-invoice-postgres psql ...` need the
      # container to be visible to the runner's
      # docker host.
      - name: Start sidecar postgres
        run: |
          docker run -d --name de-invoice-postgres \
            -e POSTGRES_USER=de_invoice \
            -e POSTGRES_PASSWORD=de_invoice_pass \
            -e POSTGRES_DB=de_invoice \
            -p 5432:5432 \
            --health-cmd "pg_isready -U de_invoice" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:16-alpine
          # Wait for the container to be healthy
          # (up to 30s — first pull of postgres:16-alpine
          # can be slow on a cold cache).
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' de-invoice-postgres 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "postgres healthy"
              break
            fi
            sleep 1
          done
          # Tier 327: explicit fail check. Without
          # this, a 30-second wait that never sees
          # 'healthy' silently passes, and the next
          # step (`prisma db push`) fails with a
          # confusing "connection refused" instead
          # of the actual container-startup cause.
          FINAL_STATUS=$(docker inspect --format='{{.State.Health.Status}}' de-invoice-postgres 2>/dev/null || echo "missing")
          if [ "$FINAL_STATUS" != "healthy" ]; then
            echo "FATAL: postgres container not healthy after 30s (status: $FINAL_STATUS)" >&2
            docker inspect de-invoice-postgres 2>&1 | head -20 >&2 || true
            docker logs de-invoice-postgres 2>&1 | head -20 >&2 || true
            exit 1
          fi
      - name: Apply prisma schema
        run: npx prisma db push --accept-data-loss --skip-generate
        working-directory: backend
      - name: Build backend (typecheck)
        run: npx tsc --noEmit
        working-directory: backend
      - name: Build frontend (typecheck)
        run: npx tsc --noEmit
        working-directory: frontend
      - name: Start backend
        run: |
          mkdir -p /tmp/de-invoice-storage
          nohup npx ts-node src/main.ts > /tmp/backend.log 2>&1 &
          # 15s — slightly more than the 8s we
          # need locally because CI runners are
          # slower for cold-start Postgres + tsc.
          for i in $(seq 1 30); do
            H=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/health 2>/dev/null || true)
            if [ "$H" = "200" ]; then
              echo "backend up"
              break
            fi
            sleep 1
          done
          if [ "$H" != "200" ]; then
            echo "=== backend startup log (last 200 lines) ==="
            tail -200 /tmp/backend.log
            echo "=== /health final status: $H ==="
            exit 1
          fi
        working-directory: backend
      # Tier 325: always upload backend.log so we can
      # diagnose startup failures even when the job is
      # cancelled or fails in a later step.
      - name: Upload backend log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-e2e-always
          path: /tmp/backend.log
          retention-days: 7
      - name: Seed test data
        # ci-seed.sh registers the admin user
        # (info@shleder.de / Test1234!) and
        # updates the SH Leder GmbH company to
        # the test fixture shape (taxId +
        # German address). Idempotent — safe
        # to re-run.
        run: bash ci-seed.sh
        working-directory: backend/e2e
      - name: Run e2e suite
        run: bash run-all.sh
        working-directory: backend/e2e
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log

  # Tier 248: Playwright UI test job. Same
  # sidecar postgres pattern as the e2e job.
  # The auth cache file
  # (/tmp/cashbook-e2e-auth.env) is written
  # by ci-seed.sh in a previous job — but
  # `actions/upload-artifact` is the official
  # way to share files between jobs. We
  # re-run the seed in this job too (idempotent,
  # so it's a no-op if the user already exists)
  # to keep the jobs self-contained.
  playwright:
    name: End-to-end tests (Playwright UI)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://de_invoice:de_invoice_pass@localhost:5432/de_invoice?schema=public
      NODE_ENV: test
      SMTP_HOST: ""
      STORAGE_PATH: /tmp/de-invoice-storage
      VIES_MOCK: "1"
      # The frontend dev server runs on 3100 in
      # CI to match the local dev setup (port 3000
      # is reserved for the SH Leder Website dev
      # server on the developer's machine).
      PORT: 3100
      # FRONTEND_URL includes the Playwright dev
      # server origin so the backend CORS allows
      # preflight requests.
      FRONTEND_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Tier 326: cache both lockfiles so the
          # second `npm ci frontend` doesn't pay
          # cold-install tax on every run.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx prisma generate
        working-directory: backend
      - name: Start sidecar postgres
        run: |
          docker run -d --name de-invoice-postgres \
            -e POSTGRES_USER=de_invoice \
            -e POSTGRES_PASSWORD=de_invoice_pass \
            -e POSTGRES_DB=de_invoice \
            -p 5432:5432 \
            --health-cmd "pg_isready -U de_invoice" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' de-invoice-postgres 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "postgres healthy"
              break
            fi
            sleep 1
          done
      - run: npx prisma db push --accept-data-loss --skip-generate
        working-directory: backend
      - name: Start backend
        run: |
          mkdir -p /tmp/de-invoice-storage
          nohup npx ts-node src/main.ts > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            H=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/health 2>/dev/null || true)
            if [ "$H" = "200" ]; then
              echo "backend up"
              break
            fi
            sleep 1
          done
          if [ "$H" != "200" ]; then
            echo "=== backend startup log (last 200 lines) ==="
            tail -200 /tmp/backend.log
            echo "=== /health final status: $H ==="
            exit 1
          fi
        working-directory: backend
      # Tier 325: always upload backend.log so we can
      # diagnose Playwright startup failures even when
      # the job is cancelled or fails in a later step.
      - name: Upload backend log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-playwright-always
          path: /tmp/backend.log
          retention-days: 7
      - name: Seed test data
        run: bash ci-seed.sh
        working-directory: backend/e2e
      - name: Start frontend
        run: |
          # NEXT_PUBLIC_API_URL is what the
          # frontend uses to reach the backend.
          # This is inlined at build time, so
          # setting it in the environment here is
          # enough.
          NEXT_PUBLIC_API_URL=http://localhost:3001 \
            nohup npx next dev -p 3100 > /tmp/frontend.log 2>&1 &
          # Next.js dev server is fast to start
          # (~5s) but `npm ci` cold caches add
          # another 10s for the first request to
          # compile. 30s total is safe.
          for i in $(seq 1 60); do
            H=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:3100/login 2>/dev/null || true)
            if [ "$H" = "200" ] || [ "$H" = "307" ] || [ "$H" = "404" ]; then
              echo "frontend up (HTTP $H)"
              break
            fi
            sleep 1
          done
          if [ "$H" != "200" ] && [ "$H" != "307" ] && [ "$H" != "404" ]; then
            cat /tmp/frontend.log
            exit 1
          fi
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run Playwright suite
        run: npx playwright test
        working-directory: frontend
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-playwright
          path: /tmp/backend.log
